server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src http://localhost:8000 http://localhost:5173 http://localhost:5174; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    location / { try_files $uri /index.html; }
}
