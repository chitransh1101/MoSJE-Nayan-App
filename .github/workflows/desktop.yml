name: Desktop app (Windows, no Docker)

# Builds DoSJE-Nigrani.exe: the backend, Sentinel, Setu and the Home page in
# one program that needs nothing installed. Tested by actually starting it,
# then published to the "desktop-latest" release that start.bat downloads
# on computers without Docker.

on:
  push:
    branches: [main]
    paths: ["backend/**", "sentinel/**", "setu/**", "launcher/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with: {node-version: 22}

      - name: Build Sentinel and Setu (served by the desktop app)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($app in "sentinel", "setu") {
            Push-Location $app
            npm install --no-audit --no-fund
            $env:VITE_USE_MOCK = "false"
            $env:VITE_SENTINEL_URL = "/sentinel/"
            $env:VITE_SETU_URL = "/setu/"
            $env:VITE_NAYAN_URL = "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            npx vite build --base=/$app/
            if ($LASTEXITCODE -ne 0) { throw "$app build failed" }
            Pop-Location
            New-Item -ItemType Directory -Force backend/desktop-web | Out-Null
            Copy-Item -Recurse $app/dist backend/desktop-web/$app
          }
          New-Item -ItemType Directory -Force backend/desktop-web/home | Out-Null
          Copy-Item launcher/index.html, launcher/status.js, launcher/site-config.js backend/desktop-web/home/

      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt}

      - name: Package with PyInstaller
        working-directory: backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pip install -r requirements.txt --upgrade pyinstaller pyinstaller-hooks-contrib
          pyinstaller desktop.py --name DoSJE-Nigrani --onedir --console --noconfirm `
            --add-data "desktop-web;web" `
            --add-data "migrations;migrations" `
            --add-data "app/api/v1/yukt_knowledge.json;app/api/v1" `
            --collect-submodules app `
            --collect-submodules uvicorn `
            --collect-submodules sklearn --collect-data sklearn `
            --collect-submodules scipy --hidden-import scipy._cyutility `
            --collect-submodules limits --collect-data limits `
            --collect-submodules slowapi `
            --collect-submodules jose `
            --collect-submodules alembic --collect-data alembic `
            --hidden-import passlib.handlers.bcrypt `
            --hidden-import email_validator `
            --exclude-module tkinter --exclude-module matplotlib --exclude-module pytest
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }

      - name: Start it and check everything answers
        shell: pwsh
        run: |
          $env:NIGRANI_NO_BROWSER = "1"
          $p = Start-Process -FilePath backend/dist/DoSJE-Nigrani/DoSJE-Nigrani.exe -PassThru `
               -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { if ((Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://localhost:8000/health).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep 2
          }
          try {
            if (-not $ok) { throw "never became healthy" }
            $login = Invoke-RestMethod -Method Post -Uri http://localhost:8000/api/v1/auth/login -ContentType "application/json" `
                     -Body '{"email":"official@dosje.gov.in","password":"Password123!"}'
            if (-not $login.access_token) { throw "login failed" }
            foreach ($u in "http://localhost:8000/", "http://localhost:8000/sentinel/", "http://localhost:8000/setu/", "http://localhost:8000/setu/some/deep/link") {
              $r = Invoke-WebRequest -UseBasicParsing $u
              if ($r.Content -notmatch 'id="root"|Open Sentinel') { throw "bad page at $u" }
            }
            Write-Host "Desktop app OK"
          } catch {
            $log = ((Get-Content out.txt -Raw) + (Get-Content err.txt -Raw))
            if ($log.Length -gt 3000) { $log = $log.Substring($log.Length - 3000) }
            $msg = ("$_`n" + $log) -replace "%","%25" -replace "`r","" -replace "`n","%0A"
            Write-Host "::error title=desktop app::$msg"
            exit 1
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path backend/dist/DoSJE-Nigrani -DestinationPath DoSJE-Nigrani-Windows.zip

      - name: Publish to the "desktop-latest" release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: desktop-latest
          commit: ${{ github.sha }}
          name: DoSJE Nigrani — Windows desktop app (latest)
          body: |
            Runs everything on one Windows computer with nothing to install (no Docker).
            Easiest: download the project and double-click start.bat — it fetches and updates this app for you.
            Manual: unzip DoSJE-Nigrani-Windows.zip and run DoSJE-Nigrani\DoSJE-Nigrani.exe, then open http://localhost:8000
            Build: ${{ github.sha }}
          artifacts: DoSJE-Nigrani-Windows.zip
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          makeLatest: false
